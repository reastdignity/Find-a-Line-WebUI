[project]
name = "find-a-line"
version = "0.1.0"
description = "Finds possible highlines in elevation data"
readme = "README.md"
requires-python = ">=3.12"  # scipy 1.18 needs it
dependencies = [
    "affine>=3.0",  # 3.0: the @ operator (`*` of transforms is deprecated)
    "authlib>=1.9.1",  # 1.9.1: fixes up to GHSA-8m4g-j4wp-wgcg (empty HMAC keys); 1.8+: its client on httpx2
    "contextily>=1.6",
    "fastapi>=0.162.0",
    "filelock>=4.2.4",
    "geojson-pydantic>=2.2",
    "geopandas>=1.1",
    "httpx2>=2.16.0",
    "itsdangerous>=2.2",  # signs the OAuth state cookie (Starlette SessionMiddleware)
    "joserfc>=1.6.8",  # Authlib's JOSE; 1.6.8: no empty HMAC keys
    "limits>=5.8",
    "matplotlib>=3.10",
    "numba>=0.68",
    "numpy>=2.3",
    "osmium>=4.3",
    "pillow>=12",
    "prometheus-client>=0.26.0",
    "psutil>=7",
    "pydantic>=2.11",
    "pydantic-settings>=2.16.1",
    "pyogrio>=0.13",  # the GML of the WFS sheet indexes (sources/indexes/listings.py)
    "pyproj>=3.7",
    "pyrate-limiter>=4.5.1",
    "pystac-client>=0.9",  # the STAC indexes (sources/indexes/listings.py)
    "rasterio>=1.4",
    "requests>=2.32",
    "scipy>=1.18",
    "shapely>=2.1",
    "sse-starlette>=3.6.0",
    "starlette>=1.3.1",
    "tqdm>=4.67",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6.0.3",  # tests/test_monitoring.py reads the compose file and Grafana's provisioning
]
tools = [
    "huggingface-hub>=2.3.0",
]
# Screenshots of the UI on desktop and phone profiles (tools/ui_shots.py) and the coverage map's media
# (tools/coverage_media.py): `uv sync --group ui`, then `uv run playwright install chromium webkit`; not installed
# by a plain `uv sync` nor in the image
ui = [
    "playwright>=1.64.1",
    "imageio-ffmpeg>=0.8.0",  # its ffmpeg encodes tools/coverage_media.py's videos and GIFs
]

[tool.uv]
package = false  # a set of scripts, not an installable package

[tool.pytest.ini_options]
testpaths = ["tests"]
