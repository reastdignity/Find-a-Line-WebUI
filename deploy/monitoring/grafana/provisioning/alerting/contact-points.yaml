# ntfy (docs/monitoring.md, "Alerts"): a webhook to the secret topic, whose whole URL is the Docker
# secret ntfy_url (FINDALINE_NTFY_URL, set from it by Grafana's entrypoint in compose.yaml;
# grafana://noop while the secret is empty). Grafana's own JSON payload carries a
# short title and message (the templates of templates.yaml); ntfy's built-in `grafana` template
# (header X-Template) turns them into the notification's title (with a mark for firing or
# resolved) and text, instead of the raw JSON. The info notices go with a low priority.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy
        type: webhook
        disableResolveMessage: false
        settings:
          url: ${FINDALINE_NTFY_URL}
          httpMethod: POST
          title: '{{ template "findaline.title" . }}'
          message: '{{ template "findaline.message" . }}'
          headers:
            X-Template: grafana
            X-Priority: "4"
            X-Tags: findaline
  - orgId: 1
    name: ntfy-info
    receivers:
      - uid: ntfy-info
        type: webhook
        disableResolveMessage: true
        settings:
          url: ${FINDALINE_NTFY_URL}
          httpMethod: POST
          title: '{{ template "findaline.title" . }}'
          message: '{{ template "findaline.message" . }}'
          headers:
            X-Template: grafana
            X-Priority: "2"
            X-Tags: findaline
