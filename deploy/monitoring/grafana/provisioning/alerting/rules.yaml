        execErrState: KeepLast
        labels:
          row: G2
          level: alert
          server: ${FINDALINE_PUBLIC_URL}
        annotations:
          summary: "/var/lib/findaline-monitoring/{{ index .Labels \"source\" }} has been missing for 26 h."
          __dashboardUid__: site
          __panelId__: "18"
