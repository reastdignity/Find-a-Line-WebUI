              refId: A
              expr: "max by (host) (increase_prometheus(internal_write_errors[10m])) or max by (host) (increase_prometheus(internal_write_metrics_dropped[10m]))"
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 10m
        noDataState: OK
        execErrState: KeepLast
        labels:
          row: G2
          level: alert
          server: ${FINDALINE_PUBLIC_URL}
        annotations:
          summary: "Telegraf's writes to VictoriaMetrics fail (or samples were dropped) for 10 min."
          __dashboardUid__: vps
          __panelId__: "40"
        isPaused: false
      - uid: g2-source-silent
        title: "G2 A source stopped reporting"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
