            model:
              refId: A
              expr: "label_set(absent_over_time(findaline_check_time[30m]), \"source\", \"check.json\") or label_set(absent_over_time(findaline_backup_time[30m]), \"source\", \"backup.json\")"
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
