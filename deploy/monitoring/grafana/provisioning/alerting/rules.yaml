            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [1]}
        for: 2m
        noDataState: OK
        execErrState: KeepLast
        labels:
          row: F1
          level: alert
          server: ${FINDALINE_PUBLIC_URL}
        annotations:
          summary: "No worker has renewed its lease for 2 min: searches wait and estimates fail (docker compose ps worker)."
          __dashboardUid__: findaline
          __panelId__: "2"
        isPaused: false
      - uid: f2-oldest-waiting
        title: "F2 Search waiting long"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model:
              refId: A
              expr: "max by (host) (findaline_job_oldest_waiting_seconds)"
              instant: true
              range: false
          - refId: C
