              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 10m
        noDataState: OK
        execErrState: KeepLast
        labels:
          row: G2
          level: alert
          server: ${FINDALINE_PUBLIC_URL}
        annotations:
          summary: "No samples of {{ index .Labels \"source\" }} for 10 min or more."
          __dashboardUid__: vps
          __panelId__: "40"
        isPaused: false
      - uid: g2-daily-file-missing
        title: "G2 A daily file is missing"
