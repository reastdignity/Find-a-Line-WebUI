# Telegraf of the monitoring (docs/monitoring.md), a drop-in for the unit of InfluxData's package:
# deploy/vps.sh (telegraf_install) installs it as /etc/systemd/system/telegraf.service.d/findaline.conf
# with the checkout's path for @REPO@. Our configuration only (not the package's telegraf.d), the
# site's settings for FINDALINE_PUBLIC_URL (C5, C6), the group adm for nginx's logs (0640 www-data
# adm), and a sandbox: Telegraf only reads (the host's /proc and /sys, nginx's logs, the facts
# files, systemd's units over D-Bus, the loopback ports and the site's address) and writes nothing
# but to its outputs on the loopback.
[Service]
ExecStart=
ExecStart=/usr/bin/telegraf -config /etc/telegraf/telegraf.conf
EnvironmentFile=@REPO@/findaline.env
SupplementaryGroups=adm
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
# The devices visible (diskio looks up /dev/<disk> for its names) but none may be opened
DevicePolicy=closed
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
UMask=0077
# As the container's limits were: 192 MB without swap, 128 tasks
MemoryMax=192M
MemorySwapMax=0
TasksMax=128
