# Telegraf of the monitoring project (compose.yaml next to this file; docs/monitoring.md): what it
# reads, row by row of docs/monitoring.md, and where it writes. Runs in the host's network
# namespace as a non-root user in the group adm; the host is read through /hostfs (HOST_PROC,
# HOST_SYS, HOST_MOUNT_PREFIX, ... set in compose.yaml).
#
# Only the fields that a panel or an alert uses are kept (fieldinclude), and no tag may carry an
# IP address, a user, a path of a request or an id (tests/test_monitoring.py checks the inputs
# that would add one). VictoriaMetrics names a series <measurement>_<field>, e.g. cpu_usage_steal.

[agent]
  interval = "30s"
  round_interval = true
  collection_jitter = "0s"
  flush_interval = "30s"
  flush_jitter = "5s"
  metric_batch_size = 1000
  # About 25 minutes of samples while VictoriaMetrics is down or restarting
  metric_buffer_limit = 50000
  # The aggregated nginx samples do not go through the processors a second time
  skip_processors_after_aggregators = true
  hostname = ""          # the host's name: Telegraf runs in its UTS namespace too (network_mode: host)
  omit_hostname = false

# VictoriaMetrics' InfluxDB endpoint in the line protocol. The http output, not influxdb: that one
# always sends ?db=telegraf, which VictoriaMetrics turns into a label of every series.
[[outputs.http]]
  url = "http://127.0.0.1:8428/write"
  method = "POST"
  data_format = "influx"
  content_encoding = "gzip"
  timeout = "10s"
  # basicstats of the nginx requests also counts the samples of bytes and rejected (the same as
  # request_time_count); VictoriaMetrics stores a string field as 0
  fieldexclude = ["bytes_count", "rejected_count", "health_status"]


###############################################################################
# A. The VPS
###############################################################################

# A1: use, iowait, steal (and the rest of the CPU); one series for all cores
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false
  fieldinclude = ["usage_user", "usage_system", "usage_iowait", "usage_steal", "usage_idle"]
  tagexclude = ["cpu"]

# A1 (load per core: load5 / n_cpus), A7 (uptime)
[[inputs.system]]
  fieldinclude = ["load1", "load5", "load15", "n_cpus", "uptime"]

# A2
[[inputs.mem]]
  fieldinclude = ["total", "available", "available_percent", "used"]

# A2: the kernel's OOM kills (a counter since boot)
[[inputs.kernel_vmstat]]
  fieldinclude = ["oom_kill"]

# A3: the root and Docker's data root (the disk image of --disk-image, docs/deployment.md); the
# paths as the host sees them (HOST_MOUNT_PREFIX is stripped)
[[inputs.disk]]
  mount_points = ["/", "/srv/docker"]
  fieldinclude = ["total", "free", "used", "used_percent", "inodes_free", "inodes_total", "inodes_used_percent"]
  taginclude = ["host", "path"]

# A5: the disk and the loop device of the disk image (the queue: io_time, iops_in_progress)
[[inputs.diskio]]
  devices = ["sd[a-z]", "vd[a-z]", "xvd[a-z]", "nvme[0-9]n[0-9]", "loop[0-9]*"]
  skip_serial_number = true
  device_tags = []
  name_templates = []
  fieldinclude = ["read_bytes", "write_bytes", "reads", "writes", "io_time", "iops_in_progress"]
  taginclude = ["host", "name"]

# A6: the traffic and errors of the physical interfaces (not Docker's bridges and veths)
[[inputs.net]]
  interfaces = ["eth*", "ens*", "enp*", "eno*"]
  fieldinclude = ["bytes_recv", "bytes_sent", "err_in", "err_out", "drop_in", "drop_out"]
  taginclude = ["host", "interface"]

# A6: TCP connections by state (counts only)
[[inputs.netstat]]
  fieldinclude = ["tcp_established", "tcp_time_wait", "tcp_close_wait", "tcp_syn_recv", "tcp_listen"]

# A7: /run/reboot-required of the host (unattended-upgrades leaves it after a kernel update);
# /hostfs/var/run would follow the symlink into the container's own /run
[[inputs.filestat]]
  interval = "5m"
  files = ["/hostfs/run/reboot-required"]
  name_override = "reboot_required"
  fieldinclude = ["exists"]
  taginclude = ["host"]

# A8: the clock's offset from chronyd's command port (Ubuntu's time daemon since 25.10), read like
# `chronyc tracking`; reference_id names the NTP server (an address): dropped
[[inputs.chrony]]
  server = "udp://127.0.0.1:323"
  metrics = ["tracking"]
  fieldinclude = ["system_time", "last_offset", "rms_offset"]
  taginclude = ["host"]


###############################################################################
# B. Docker (through the socket proxy of compose.yaml)
###############################################################################

# B1, B2: the containers of both projects (findaline-web-1, findaline-worker-1,
# findaline-monitoring-*), also stopped ones (a missing `running` shows); no labels as tags
[[inputs.docker]]
  endpoint = "tcp://127.0.0.1:2375"
  startup_error_behavior = "retry"   # the proxy not up yet: try again at the next interval
  container_name_include = ["findaline-*"]
  container_state_include = ["created", "restarting", "running", "removing", "paused", "exited", "dead"]
  docker_label_exclude = ["*"]
  perdevice_include = []
  total_include = ["cpu"]
  timeout = "5s"
  fieldinclude = ["n_containers", "n_containers_running", "usage", "limit", "usage_percent",
                  "throttling_throttled_periods", "oomkilled", "restart_count", "exitcode",
                  "uptime_ns", "health_status", "failing_streak"]
  taginclude = ["host", "container_name", "container_status"]

# docker_container_health_health_code: healthy 0, starting 1, unhealthy 2 (VictoriaMetrics keeps
# numbers only, not the string health_status)
[[processors.enum]]
  namepass = ["docker_container_health"]
  [[processors.enum.mapping]]
    fields = ["health_status"]
    dest = "health_code"
    default = 3
    [processors.enum.mapping.value_mappings]
      healthy = 0
      starting = 1
      unhealthy = 2


###############################################################################
# C. The site (nginx on the host)
###############################################################################

# C1-C3: the metrics log of the site's 443 server (deploy/nginx: one JSON object per request,
# without any address or path; `group` is the route group of nginx's map). Turned into two
# measurements by the processor below and aggregated every 30 s: no sample per request.
[[inputs.tail]]
  files = ["/var/log/nginx/findaline.metrics.log"]
  initial_read_offset = "end"   # no state file: new lines only, also after a restart
  watch_method = "inotify"
  path_tag = ""                 # no tag with the log file's path
  name_override = "nginx_log"
  data_format = "json"
  tag_keys = ["group"]
  json_string_fields = ["upstream_time", "limit"]

# nginx_log -> nginx_requests {group, class} (request_time, bytes, rejected: 1 for a refusal of a
# limit_req zone) and nginx_times {group} (request_time, upstream_time: the first of nginx's list,
# none for "-"). Tags are set here only: nothing of the log but these reaches the store.
[[processors.starlark]]
  namepass = ["nginx_log"]
  source = '''
def number(text):
    text = text.strip()
    if text == "" or text.count(".") > 1:
        return None
    for c in text.elems():
        if c not in "0123456789.":
            return None
    return float(text)

def apply(metric):
    status = int(metric.fields.get("status", 0))
    tags = {"host": metric.tags.get("host", ""), "group": metric.tags.get("group", "page")}
    request_time = float(metric.fields.get("request_time", 0.0))

    requests = Metric("nginx_requests")
    for key, value in tags.items():
        requests.tags[key] = value
    requests.tags["class"] = "%dxx" % (status // 100)
    requests.fields["request_time"] = request_time
    requests.fields["bytes"] = float(metric.fields.get("bytes", 0.0))
    limit = metric.fields.get("limit", "")
    requests.fields["rejected"] = 1.0 if limit.startswith("REJECTED") else 0.0
    requests.time = metric.time

    times = Metric("nginx_times")
    for key, value in tags.items():
        times.tags[key] = value
    times.fields["request_time"] = request_time
    upstream = number(metric.fields.get("upstream_time", "-").replace(":", ",").split(",")[0])
    if upstream != None:
        times.fields["upstream_time"] = upstream
    times.time = metric.time
    return [requests, times]
'''

# C1, C3: per group and status class every 30 s: nginx_requests_request_time_count (requests),
# _request_time_sum (seconds, for the mean), _bytes_sum, _rejected_sum
[[aggregators.basicstats]]
  namepass = ["nginx_requests"]
  period = "30s"
  drop_original = true
  stats = ["count", "sum"]

# C2: nginx_times_request_time_050/_095/_099 and nginx_times_upstream_time_* per group
[[aggregators.quantile]]
  namepass = ["nginx_times"]
  period = "30s"
  drop_original = true
  quantiles = [0.50, 0.95, 0.99]

# C4: stub_status on its loopback-only port (deploy/nginx/findaline-http.conf)
[[inputs.nginx]]
  urls = ["http://127.0.0.1:8081/nginx_status"]
  response_timeout = "5s"
  fieldinclude = ["active", "reading", "writing", "waiting", "accepts", "handled", "requests"]
  taginclude = ["host"]

# C5: the site's certificate as a browser gets it; x509_cert_expiry: seconds until it ends
# (the README's "since the Unix epoch" is wrong), type leaf or intermediate
[[inputs.x509_cert]]
  interval = "5m"
  sources = ["${FINDALINE_PUBLIC_URL}"]
  timeout = "10s"
  fieldinclude = ["expiry", "verification_code"]
  taginclude = ["host", "type"]

# C6: the home page through the site's public address (DNS, nginx, the web service)
[[inputs.http_response]]
  urls = ["${FINDALINE_PUBLIC_URL}/"]
  method = "GET"
  response_timeout = "10s"
  follow_redirects = false
  fieldinclude = ["http_response_code", "response_time", "result_code"]
  taginclude = ["host"]


###############################################################################
# D. Services and security
###############################################################################

# D1: the units of docs/deployment.md through systemd's D-Bus API (the system bus' socket; any
# user may list the units). A bus that refuses the connection stops Telegraf at its start (the
# plugin's error is not one it retries), which the CI job would show. Also units not loaded
# (collect_disabled_units: a missing unit has load_code 2). The states are fields (load_code,
# active_code: 3 is failed), not tags, so a change of state starts no new series.
[[inputs.systemd_units]]
  interval = "5m"
  unittype = "service"
  pattern = "nginx.service docker.service fail2ban.service ssh.service unattended-upgrades.service"
  collect_disabled_units = true
  fieldinclude = ["load_code", "active_code"]
  taginclude = ["host", "name"]

[[inputs.systemd_units]]
  interval = "5m"
  unittype = "timer"
  pattern = "certbot.timer findaline-backup.timer findaline-facts.timer findaline-heartbeat.timer"
  collect_disabled_units = true
  fieldinclude = ["load_code", "active_code"]
  taginclude = ["host", "name"]

# A4, A7, D2: what only root can read, written by deploy/monitoring/facts.sh every 5 minutes:
# findaline_facts_fail2ban_<jail>_banned(_total), _failed(_total), _image_holes_bytes,
# _updates_pending, _updates_security, _time (when it was written)
[[inputs.file]]
  interval = "5m"
  files = ["/var/lib/findaline-monitoring/facts.json"]
  name_override = "findaline_facts"
  data_format = "json"
  taginclude = ["host"]

# D3: the daily `vps.sh check`: findaline_check_ok, _failed, _time
[[inputs.file]]
  interval = "5m"
  files = ["/var/lib/findaline-monitoring/check.json"]
  name_override = "findaline_check"
  data_format = "json"
  taginclude = ["host"]

# E1, E2: the last run of deploy/backup.sh: findaline_backup_success, _last_success, _seconds,
# _added_bytes, _repo_bytes, _snapshots, _time
[[inputs.file]]
  interval = "5m"
  files = ["/var/lib/findaline-monitoring/backup.json"]
  name_override = "findaline_backup"
  data_format = "json"
  taginclude = ["host"]


###############################################################################
# G2. Monitoring of the monitoring
###############################################################################

# Telegraf's own counters: internal_agent_*, internal_write_* (output=influxdb),
# internal_gather_* (input=<plugin>)
[[inputs.internal]]
  collect_memstats = false
  fieldinclude = ["write_errors", "metrics_dropped", "metrics_written", "gather_errors", "errors",
                  "buffer_size"]
  taginclude = ["host", "input", "output"]

# VictoriaMetrics' own metrics: prometheus_vm_free_disk_space_bytes, _vm_data_size_bytes{type},
# _vm_rows_inserted_total{type} and _vm_rows_invalid_total{type} (type: the protocol, influx for
# Telegraf's); the path of the free space is its storage folder
[[inputs.prometheus]]
  urls = ["http://127.0.0.1:8428/metrics"]
  metric_version = 2
  fieldinclude = ["vm_free_disk_space_bytes", "vm_data_size_bytes", "vm_rows_inserted_total",
                  "vm_rows_invalid_total"]
  taginclude = ["host", "type"]
