# Monitoring of the public site (docs/monitoring.md): Telegraf, on the host (InfluxData's package,
# telegraf.conf and systemd/telegraf.service.d next to this file, installed by deploy/vps.sh),
# reads the host, the containers, nginx and the facts files of the host's timers and writes to
# VictoriaMetrics, and the log lines of web, worker and nginx's error log to VictoriaLogs; Grafana
# shows the dashboards VPS, Site, Find-a-Line and Logs and sends its alerts to ntfy. A project of
# its own, so monitoring is started, updated and stopped without touching the site (compose.yaml
# of the checkout's root).
#
# deploy/vps.sh runs it from the checkout's root (docker compose -f deploy/monitoring/compose.yaml
# pull, then up -d --wait --remove-orphans); the project directory is this folder. Before that:
# - .env next to this file (copy .env.example): DOCKER_GID of the host;
# - ../../findaline.env (the site's settings): Grafana reads FINDALINE_PUBLIC_URL from it;
# - ../../secrets/grafana_admin_password and ../../secrets/ntfy_url, readable by uid 472
#   (Grafana's user); secrets/README.md;
# - /var/lib/findaline-grafana-plugins: the logs data source plugin of Grafana, at the version and
#   sha256 pinned in deploy/vps.sh (grafana_plugins).
#
# Nothing is reachable from outside: VictoriaMetrics, VictoriaLogs, Grafana and the socket proxy
# publish their ports on the host's loopback only (Grafana is opened through an SSH tunnel, docs/deployment.md);
# Telegraf listens on nothing. Their network has a fixed
# bridge name, br-fal-mon, so the host's firewall keeps it away from private addresses and the
# host like the site's networks (deploy/firewall/ufw-after.rules).

name: findaline-monitoring

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  # Telegraf is no service here: in a container it read the host through a mount of the whole /, and
  # the host's D-Bus (systemd's units, D1) refused its uid, which has no user on the host. It runs
  # on the host (docs/monitoring.md, "Decisions"), reads the containers through the socket
  # proxy below, never the Docker socket itself (root on the host), and writes to the published
  # loopback ports of VictoriaMetrics and VictoriaLogs.
  victoriametrics:
    <<: *hardening
    image: victoriametrics/victoria-metrics:v1.154.0@sha256:4bd592341587d669b7f57d54bbb82bd21ac8675f4e24234b7703a7c0f85197d8
    user: "65534:65534"
    # The volume is mounted on the image's /var/tmp: a new volume takes the mode of the directory
    # it covers (1777), so the non-root user can create its folder there; any other directory of
    # the image belongs to root and would leave the volume read-only for it
    command:
      - -storageDataPath=/var/tmp/victoria-metrics
      - -retentionPeriod=100y            # the maximum: no time limit (docs/monitoring.md, "Retention")
      - -httpListenAddr=:8428
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    volumes:
      - victoriametrics:/var/tmp
    ports: ["127.0.0.1:8428:8428"]
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 3
    stop_grace_period: 30s

  # The log lines of web, worker and nginx's error log (Telegraf's second output), 30 days
  # (docs/monitoring.md, "The logs"). A distroless image: no shell, no wget, so no healthcheck of
  # its own; vps.sh check asks its /health. The volume is mounted on the image's home
  # of its user nonroot (65532, mode 0700): a new volume takes that owner, so it can write there.
  victorialogs:
    <<: *hardening
    image: victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d
    user: "65532:65532"
    command:
      - -storageDataPath=/home/nonroot/victoria-logs
      - -retentionPeriod=30d             # the privacy page: server logs deleted after 30 days
      - -httpListenAddr=:9428
    mem_limit: 320m
    memswap_limit: 320m
    pids_limit: 128
    volumes:
      - victorialogs:/home/nonroot
    ports: ["127.0.0.1:9428:9428"]
    networks: [monitoring]
    # No healthcheck (see above): `up --wait` takes it as ready once it runs; `disable: true`
    # would make --wait fail
    stop_grace_period: 30s

  grafana:
    <<: *hardening
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    user: "472:472"
    # The ntfy topic's URL from its secret into FINDALINE_NTFY_URL (the contact points'); an empty
    # secret (before setup has a topic) becomes Grafana's grafana://noop, which sends nothing:
    # an empty URL would fail the provisioning and with it Grafana's start
    entrypoint:
      - /bin/sh
      - -c
      - |
        url="$$(tr -d '\r\n' < /run/secrets/ntfy_url)"
        export FINDALINE_NTFY_URL="$${url:-grafana://noop}"
        exec /run.sh
    # Grafana 13 idles at about 250 MiB; opening the dashboard Find-a-Line (77 panels queried at
    # once) took it past 512 MiB and the kernel killed it (2026-11-02). GOMEMLIMIT below makes
    # Go's collector work harder before this hard limit is reached
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    # FINDALINE_PUBLIC_URL: the server the alerts name (label `server` of the rules; Grafana
    # expands environment variables in its provisioning files)
    env_file: [../../findaline.env]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Read when Grafana creates its database only; to change it later: grafana cli
      # admin reset-admin-password in the container (docs/deployment.md)
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SERVER_ROOT_URL: http://localhost:3000/   # the SSH tunnel's end: the links of the alerts
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Nothing sent to Grafana Labs or fetched from it: no usage reports, update checks, news,
      # plugin installs at start, external snapshots
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # The one plugin (VictoriaLogs' data source), downloaded and checked by deploy/vps.sh
      # (grafana_plugins) into a read-only folder: Grafana fetches nothing itself
      GF_PATHS_PLUGINS: /var/lib/grafana-plugins
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_LOG_MODE: console
      GOMEMLIMIT: 800MiB   # Go's soft limit, below mem_limit (see there)
    secrets: [grafana_admin_password, ntfy_url]
    volumes:
      - grafana:/var/lib/grafana   # its database: nothing that cannot be provisioned again
      - {type: bind, source: ./grafana/provisioning, target: /etc/grafana/provisioning, read_only: true}
      - {type: bind, source: ./grafana/dashboards, target: /etc/grafana/dashboards, read_only: true}
      - {type: bind, source: /var/lib/findaline-grafana-plugins, target: /var/lib/grafana-plugins,
         read_only: true, bind: {create_host_path: false}}
      - type: tmpfs
        target: /tmp
        tmpfs: {size: 67108864}   # 64 MB
    ports: ["127.0.0.1:3000:3000"]
    networks: [monitoring]   # egress: the ntfy server only
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
      retries: 3
    depends_on:
      victoriametrics: {condition: service_healthy}
      victorialogs: {condition: service_started}

  # Telegraf's docker and docker_log inputs through an allowlist (Go regular expressions, anchored
  # by the proxy): the API version check, /info, the container list, a container's inspect, its
  # stats and its logs (Telegraf asks only for those of web and worker), all GET; no exec, events
  # or anything that changes state. Telegraf reaches it on the host's
  # loopback; such connections arrive from the network's gateway (172.30.2.1), the only address
  # allowed in.
  socket-proxy:
    <<: *hardening
    image: wollomatic/socket-proxy:1.13.1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002
    user: "65534:${DOCKER_GID:?DOCKER_GID missing: copy .env.example to .env}"   # the socket's group
    mem_limit: 32m
    memswap_limit: 32m
    pids_limit: 64
    command:
      - -listenip=0.0.0.0
      - -allowfrom=172.30.2.1/32
      - -allowHEAD=/_ping
      - -allowGET=/_ping
      - -allowGET=/v1\.[0-9]+/(info|containers/json|containers/[0-9a-f]{64}/(json|stats|logs))
      - -allowhealthcheck
      - -watchdoginterval=300   # a broken socket (after a Docker update) stops it; restart brings it back
      - -stoponwatchdog
      - -shutdowngracetime=5
    volumes:
      - {type: bind, source: /var/run/docker.sock, target: /var/run/docker.sock, read_only: true,
         bind: {create_host_path: false}}
    ports: ["127.0.0.1:2375:2375"]
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
      retries: 3

volumes:
  victoriametrics:   # the samples, without a time limit; no backup (docs/monitoring.md, "Storage")
  victorialogs:      # the log lines of 30 days; no backup
  grafana:

networks:
  monitoring:
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-fal-mon
    # A fixed gateway: the address the published ports' connections come from, which the socket
    # proxy allows (-allowfrom)
    ipam:
      config:
        - subnet: 172.30.2.0/24
          gateway: 172.30.2.1

secrets:
  grafana_admin_password:
    file: ../../secrets/grafana_admin_password
  ntfy_url:
    file: ../../secrets/ntfy_url
