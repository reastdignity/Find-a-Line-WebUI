# For the stand-in proxy of compose.test.yaml: the settings of SWAG's proxy.conf
# (https://github.com/linuxserver/docker-swag, root/defaults/nginx/proxy.conf.sample, "Version 2026/10/20",
# read 2026-11-16) that matter between two plain-HTTP nginx, written out here, not copied (that
# repository is GPL-3.0). As in SWAG: no proxy_buffering line (nginx's default, on, applies unless the
# upstream sends X-Accel-Buffering: no), no proxy_ignore_headers, no proxy_max_temp_file_size (1024m), and
# X-Real-IP set to the address the proxy sees, overwriting what a visitor sends. Left out: the TLS-only
# headers (Early-Data, X-Forwarded-Ssl), the cookie cache bypass and the headers the mirror never reads.
proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
proxy_buffers 32 4k;
proxy_connect_timeout 240;
proxy_read_timeout 240;
proxy_send_timeout 240;
proxy_http_version 1.1;
proxy_redirect http:// $scheme://;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Host $host;
proxy_set_header Proxy "";
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
