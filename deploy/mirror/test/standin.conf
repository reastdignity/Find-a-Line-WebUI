# The stand-in for SWAG (compose.test.yaml): plain nginx with what SWAG's nginx.conf.sample sets
# that matters here (its access log on for every host, any body size, the $connection_upgrade map,
# Docker's resolver), SWAG's proxy.conf.sample (swag-proxy.conf) and the mirror's own SWAG conf
# (../swag/findaline-mirror.subdomain.conf), which standin.sh turns into plain HTTP on port 8080
# (/tmp/standin/site.conf). Buffering stays at nginx's default (on), as in SWAG.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 0;
    gzip_vary on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # SWAG's access log, for every host that does not switch it off (here on stdout)
    access_log /dev/stdout combined;

    include /tmp/standin/site.conf;
}
