# The mirror's file server (docs/mirror-hosting/spec.md, section 4: solution A). nginx in its
# unprivileged image (uid 101), read-only root; the start script (start.sh) writes what it
# generates into /tmp/mirror (a tmpfs) before nginx starts: the trusted addresses, the address
# range whose X-Real-IP is believed, the landing page with the contact.
#
# Folders: /srv/public is <root>/public (read-only), /var/log/mirror is <root>/logs (the log, one
# file a day, kept 14 days by the start script's cleanup loop).
#
# Pairs: the served patterns <-> sources.readers.tilebases.grid_tile_name, gridtiles.res_name and
# the publish tool's layout; the log's keys <-> tools/mirror_publish.py stats <-> the privacy
# texts; the limits <-> the client's entries in sources/net.py (tests/test_mirror_deploy.py pins
# the numbers). tests/mirror_check.sh checks every behaviour, its self-test each one switched off.

worker_processes 2;
pid /tmp/nginx.pid;
# "crit": nginx writes the request line (with the tile's path) and the client's address into
# ordinary error-level lines (a refused symlink, a file it cannot open); start-up errors (emerg)
# still show. Nothing of a request reaches the container's stdout or stderr.
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # The types of the served files only (A.3)
    types {
        image/tiff tif;
        application/json json;
        text/plain md txt;
        text/html html;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/plain;          # text/html always gets it; JSON and TIFF never

    server_tokens off;                 # "Server: nginx", no version
    sendfile on;
    sendfile_max_chunk 256k;           # keeps limit_rate close to its number
    tcp_nopush on;
    etag on;
    autoindex off;
    disable_symlinks on;               # no symlink anywhere in a served path
    log_not_found off;
    max_ranges 1;
    client_max_body_size 1k;

    # Timeouts for a slow visitor (A.6)
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;
    reset_timedout_connection on;

    # An index is about 1.2 MB of JSON
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;

    # --- The visitor's address (A.5, P15): X-Real-IP, which SWAG sets to the address it sees, is
    # believed from any sender on the project's own network (only SWAG and the mirror are there);
    # realip.conf holds "set_real_ip_from <MIRROR_SUBNET>;"
    include /tmp/mirror/realip.conf;
    real_ip_header X-Real-IP;
    real_ip_recursive off;

    # --- The classes: the trusted addresses (MIRROR_TRUSTED_ADDRESSES, written by the start
    # script as "<address> trusted;"), the healthcheck on the loopback, everyone else a visitor
    geo $mirror_class {
        default visitor;
        127.0.0.1 local;
        include /tmp/mirror/trusted.conf;
    }
    # An empty key is not counted by limit_conn and limit_req
    map $mirror_class $visitor_key { visitor $binary_remote_addr; default ""; }
    map $mirror_class $visitor_all { visitor "all";               default ""; }
    map $mirror_class $trusted_key { trusted $binary_remote_addr; default ""; }
    # Bytes a second per request (MB decimal): visitors 4 MB/s, the trusted class 16 MB/s
    map $mirror_class $mirror_rate { visitor 4000000; trusted 16000000; default 0; }

    limit_conn_zone $visitor_key zone=visitor_address:2m;
    limit_conn_zone $visitor_all zone=visitors_all:64k;
    limit_conn_zone $trusted_key zone=trusted_address:64k;
    limit_req_zone  $visitor_key zone=visitor_rate:4m rate=20r/s;
    limit_conn_status 429;
    limit_req_status 429;
    limit_conn_log_level info;
    limit_req_log_level info;

    # Every refusal by a limit: 429 with Retry-After: 10 (P17)
    map $status $retry_after { 429 "10"; default ""; }
    # Cache-Control (A.3): an index and the list may change when a dataset is swapped (U8)
    map $uri $cache_control {
        "~\.tif$"   "max-age=86400";
        "~\.json$"  "no-cache";
        default     "";
    }

    # --- The log (A.7): one JSON object a line with exactly the keys t, s, b, rt, ds, a, lim, v
    # (the privacy texts name exactly these); never the tile's path, the query or the rest of the
    # User-Agent. One file a day: access-YYYY-MM-DD.log, the day of the container's clock, which
    # is UTC (TZ=UTC in the Dockerfile); start.sh's cleanup uses the same day.
    map $uri $mirror_dataset {
        "~^/v1/tiles/(?<ds>[a-z0-9_-]+)/"  $ds;
        default                             "-";
    }
    map $http_user_agent $mirror_version {
        "~^Find-a-Line/(?<v>[0-9A-Za-z.+-]{1,32})(?![0-9A-Za-z.+-])"  $v;
        default                                                       "other";
    }
    # The limit that refused: "rate" (a visitor's requests a second), "conn" (a visitor's
    # concurrent requests: its address's 4 or all visitors' 8; nginx does not say which zone),
    # "trusted" (a trusted address's 4); "-" when none
    map "$limit_req_status:$limit_conn_status:$mirror_class" $mirror_limit {
        "~^REJECTED:"                 rate;
        "~^[^:]*:REJECTED:trusted$"   trusted;
        "~^[^:]*:REJECTED:"           conn;
        default                       "-";
    }
    map $time_iso8601 $mirror_day {
        "~^(?<day>\d{4}-\d{2}-\d{2})"  $day;
        default                         "unknown";
    }
    map $mirror_class $mirror_loggable { local 0; default 1; }   # the healthcheck is not logged
    log_format mirror escape=json
        '{"t":"$time_iso8601","s":$status,"b":$body_bytes_sent,"rt":$request_time,'
        '"ds":"$mirror_dataset","a":"$remote_addr","lim":"$mirror_limit","v":"$mirror_version"}';
    access_log /var/log/mirror/access-$mirror_day.log mirror if=$mirror_loggable;
    open_log_file_cache max=4 inactive=60s valid=60s min_uses=1;

    server {
        listen 8080 default_server;
        server_name _;
        root /srv/public;

        # On every answer, refusals and errors too
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex" always;
        # The proxy in front must not buffer: otherwise it takes a file at once into its
        # temporary files, the mirror's connection ends in milliseconds and the connection caps
        # count nothing (nginx honours the header unless proxy_ignore_headers names it)
        add_header X-Accel-Buffering "no" always;
        add_header Retry-After $retry_after always;
        add_header Cache-Control $cache_control;

        limit_conn visitor_address 4;
        limit_conn visitors_all 8;
        limit_conn trusted_address 4;
        limit_req zone=visitor_rate burst=40 nodelay;
        limit_rate $mirror_rate;

        # Server-level rewrite phase: before the limits, so a refused method, query or range
        # costs no allowance
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($request_uri ~ "\?") { return 400; }
        if ($http_range ~ ",") { return 416; }

        # Never 403 (ban rules of proxies count it): a refused symlink becomes a 404
        error_page 403 =404 /__not_found;
        location = /__not_found { internal; return 404; }

        location = / {
            root /tmp/mirror/site;
            try_files /index.html =404;
        }
        location = /robots.txt { root /usr/share/findaline-mirror; }
        # The served files; a folder under such a name is a 404, not a redirect to its "/"
        location = /v1/datasets.json {
            if (-d $request_filename) { return 404; }
        }
        location ~ "^/v1/tiles/[a-z0-9_-]+/README\.md$" {
            if (-d $request_filename) { return 404; }
        }
        location ~ "^/v1/tiles/[a-z0-9_-]+/[a-z0-9_-]+/[0-9]+(\.[0-9]+)?m/index\.json$" {
            if (-d $request_filename) { return 404; }
        }
        location ~ "^/v1/tiles/[a-z0-9_-]+/[a-z0-9_-]+/[0-9]+(\.[0-9]+)?m/-?[0-9]+_-?[0-9]+/-?[0-9]+_-?[0-9]+\.tif$" {
            if (-d $request_filename) { return 404; }
        }
        # Everything else: other paths, folders, dot-files, .part files, /v1/cubes/ and
        # /v1/cache/ (reserved)
        location / { return 404; }
    }
}
