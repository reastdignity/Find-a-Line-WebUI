## Find-a-Line's data server behind SWAG (linuxserver/swag): docs/mirror-hosting/spec.md, A.8;
## deploy/mirror/README.md, "SWAG". Copy to SWAG's /config/nginx/proxy-confs/ (the name ends in
## .subdomain.conf) and restart SWAG. Before that:
## - the mirror's project runs and SWAG is attached to its network findaline-mirror_mirror, so it
##   reaches the service by the alias findaline-mirror-files;
## - mirror.findaline.lukawski.org is in SWAG's certificate (a planned maintenance stop: the
##   README's "Certificate").
## The shape of SWAG's _template.subdomain.conf.sample (reverse-proxy-confs, Version 2025/07/18),
## with these differences:
## - no IPv6 listener (see the listen line);
## - an explicit server_name (the template's <container_name>.* would need the host's first label
##   to be the container's name);
## - only GET and HEAD, and a request body of at most 1 KB, refused here: the template allows any
##   size, and SWAG would write a posted body to its disk before the mirror's 405. A 405, never
##   403: fail2ban's jails count 403 ("access forbidden by rule");
## - no access log for this host, and the error log at "crit" only: their lines would hold the
##   tile's path and the visitor's address, which the mirror's privacy text rules out;
## - no proxy_ignore_headers and no proxy_buffering line: the mirror's "X-Accel-Buffering: no"
##   must reach SWAG, or the mirror's connection caps count nothing.

server {
    listen 443 ssl;
    # No IPv6 listener for this host (and no AAAA record for the name, docs/mirror-hosting/spec.md
    # section 3): the mirror's limits count each IPv6 address on its own, so one visitor with a /64
    # could pass them. It may come back when the limits count a /64 as one visitor.

    server_name mirror.findaline.lukawski.org;

    include /config/nginx/ssl.conf;

    client_max_body_size 1k;
    access_log off;
    error_log /config/log/nginx/error.log crit;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app findaline-mirror-files;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
