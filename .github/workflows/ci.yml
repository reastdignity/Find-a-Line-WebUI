# Offline tests on Linux and Windows, and audits of the locked dependencies.
# macOS is left out until it is needed (docs/roadmap.md, "Deferred"). The docker job builds and smoke-tests the image;
# the monitoring job runs the monitoring project (deploy/monitoring).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Actions are pinned to the commit of a release (a tag can be moved); the comment names it
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.13"

      - name: Python dependencies
        run: uv sync --frozen

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      # test_viewer.py needs node_modules (esbuild) and checks that viewer/dist is built from viewer/src
      - name: Viewer dependencies and type check
        working-directory: viewer
        run: |
          npm ci
          npm run check

      # Headless Edge tests run where Edge is installed (windows-latest) and are skipped elsewhere
      - name: Tests
        run: uv run --frozen pytest -q

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.13"

      # The locked runtime dependencies with hashes: pip-audit checks exactly these pins, without pip resolving anything
      - name: pip-audit
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements.txt -o requirements-audit.txt
          uv tool run pip-audit@2.10.1 --strict --disable-pip --require-hashes --progress-spinner off -r requirements-audit.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24

      # Only what goes into the bundle (the dev tools never reach users)
      - name: npm audit
        working-directory: viewer
        run: npm audit --omit=dev

  # The image of the public site: build it, run a search and the two services in it as compose
  # runs them (read-only root, no capabilities), and check the compose files with example settings
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Example settings and secrets
        run: |
          cp findaline.env.example findaline.env
          # web --public starts only with a sign-in provider; the ids (and secrets below) are dummies
          printf 'FINDALINE_GITHUB_CLIENT_ID=ci-dummy\nFINDALINE_GOOGLE_CLIENT_ID=ci-dummy\n' >> findaline.env
          printf 'WORKER_CPUS=2\nWORKER_MEMORY=4g\n' > .env
          for name in findaline_session_secret findaline_github_client_secret findaline_google_client_secret \
              findaline_microsoft_client_secret; do
            python3 -c "import secrets; print(secrets.token_urlsafe(48))" > "secrets/$name"
          done
          # the keys of data services empty: no NASADEM, no Denmark (falls back to europe)
          for name in opentopography_api_key datafordeler_api_key lantmateriet_user lantmateriet_password nls_api_key; do
            : > "secrets/$name"
          done
          # the web service's key of the satellite map empty: no Esri layer
          : > secrets/esri_api_key

      - name: Compose files
        run: docker compose config --quiet

      - name: Build the image
        run: docker compose build

      - name: Command line in the image
        run: docker compose run --rm --no-deps worker --help

      # The Żabi Koń clip offline: the run must land in /data, numba's cache in the service's /tmp
      - name: A search in the image
        run: |
          docker compose run --rm --no-deps --volume "$PWD/tests/data:/clip:ro" worker \
            --elevation-file /clip/zabi_kon_nmt.tif --surface-file /clip/zabi_kon_nmpt.tif \
            --northing 254608 --easting 553966 --radius 290 --water off --fill-gaps off --no-plot --yes

      # --wait: until the web service's healthcheck passes
      - name: Services
        run: |
          docker compose up --detach --wait --wait-timeout 120
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: findaline.example.org' http://127.0.0.1:8765/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/)" = 400  # any other host
          # The app's metrics (metrics.py) on their own published loopback port, with a live worker;
          # never on the site's port, which nginx proxies (the app has no such route)
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:8766/metrics > metrics.txt && grep -qE '^findaline_workers_alive 1\.0$' metrics.txt && break
            sleep 1
          done
          grep -E '^findaline_build_info\{version="[^"]+"\} 1\.0$' metrics.txt
          grep -E '^findaline_workers_alive 1\.0$' metrics.txt
          grep -E '^findaline_users\{status="pending"\} ' metrics.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: findaline.example.org' http://127.0.0.1:8765/metrics)" = 404
          # numba's threads follow WORKER_CPUS, not the cores the container sees
          test "$(docker compose exec -T worker python -c 'import numba; print(numba.config.NUMBA_NUM_THREADS)')" = 2
          docker compose stop worker
          docker compose ps --all
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps --all --quiet worker)")" = 0

      # nginx on the host reaches the web service through its published loopback port; the app
      # trusts X-Forwarded-For from the gateway of the network `web` only (FINDALINE_TRUSTED_PROXY),
      # so such a connection must arrive from it
      - name: Source of the published port's connections
        run: |
          docker run --detach --name probe --network findaline_web -p 127.0.0.1:8767:8767 \
            --entrypoint python findaline:local -u -m http.server 8767
          for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:8767/ && break; sleep 1; done
          docker logs probe 2>&1 | tail -1
          docker logs probe 2>&1 | grep -q '^172\.30\.0\.1 '
          docker rm -f probe

      # deploy/nginx and deploy/fail2ban on Ubuntu's packages, in front of the web service
      - name: nginx and fail2ban
        run: |
          docker run --rm --network findaline_web -v "$PWD:/src:ro" \
            ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c \
            bash /src/tests/nginx_check.sh

      - name: Logs
        if: always()
        run: docker compose logs --no-color

      - name: Clean up
        if: always()
        run: |
          docker compose down --volumes
          docker rm -f probe || true

  # The monitoring project (deploy/monitoring, docs/monitoring.md) on the runner as the host: its
  # compose file, then the four services with dummy secrets, Grafana's plugin and Telegraf on the
  # host as deploy/vps.sh installs them (the pinned package, its sandbox), and stand-ins of what the
  # host's side writes (the nginx metrics and error logs, the facts files); the runner's systemd
  # answers over D-Bus. Checks that VictoriaMetrics holds Telegraf's samples, that a line of nginx's
  # error log reaches VictoriaLogs with its address masked, and that Grafana has its provisioning.
  monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE: docker compose -f deploy/monitoring/compose.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.13"

      # Also part of the tests job (PyYAML is in the dev group); here before the stack starts
      - name: Offline checks of the provisioning
        run: uv run --frozen pytest -q tests/test_monitoring.py

      - name: Settings, secrets and the host's files
        run: |
          cp findaline.env.example findaline.env
          python3 -c "import secrets; print(secrets.token_urlsafe(24))" > secrets/grafana_admin_password
          echo "https://ntfy.invalid/ci" > secrets/ntfy_url   # nothing is sent
          chmod 0644 secrets/grafana_admin_password secrets/ntfy_url   # Grafana runs as uid 472
          printf 'DOCKER_GID=%s\n' "$(getent group docker | cut -d: -f3)" > deploy/monitoring/.env
          sudo install -d -m 0755 /var/log/nginx /var/lib/findaline-monitoring
          sudo install -m 0640 -o root -g adm /dev/null /var/log/nginx/findaline.metrics.log
          sudo install -m 0640 -o root -g adm /dev/null /var/log/nginx/findaline.error.log
          now=$(date +%s)
          echo "{\"time\": $now, \"fail2ban\": {\"findaline\": {\"banned\": 0, \"banned_total\": 3, \"failed\": 1, \"failed_total\": 9}, \"sshd\": {\"banned\": 2, \"banned_total\": 40, \"failed\": 5, \"failed_total\": 300}}, \"updates_pending\": 2, \"updates_security\": 0}" \
            | sudo tee /var/lib/findaline-monitoring/facts.json
          echo "{\"time\": $now, \"ok\": 40, \"failed\": 0}" | sudo tee /var/lib/findaline-monitoring/check.json
          echo "{\"time\": $now, \"success\": 1, \"last_success\": $now, \"seconds\": 60, \"added_bytes\": 1000, \"repo_bytes\": 100000, \"snapshots\": 3}" \
            | sudo tee /var/lib/findaline-monitoring/backup.json
          echo "{\"time\": $now, \"logins\": 7}" | sudo tee /var/lib/findaline-monitoring/ssh.json

      # Downloaded and checked against the sha256 of deploy/vps.sh, as on the server
      - name: Grafana's plugin
        run: sudo bash -c '. deploy/vps.sh; grafana_plugins'

      - name: Compose file
        run: $COMPOSE config --quiet

      - name: Services
        run: |
          $COMPOSE pull --quiet
          $COMPOSE up --detach --wait --wait-timeout 240
          $COMPOSE ps

      # Downloaded and checked against the sha256 of deploy/vps.sh, our configuration and the
      # sandbox's drop-in, started as on the server
      - name: Telegraf on the host
        run: |
          sudo bash -c '. deploy/vps.sh; telegraf_install'
          systemctl is-active telegraf
          systemd-analyze security --no-pager telegraf | tail -n 1

      # Requests in the metrics log format of deploy/nginx (one JSON object per line); the inputs of
      # 5 minutes (the facts files, systemd's units) report at the next 5-minute mark
      - name: Samples
        run: |
          query() { curl -sf http://127.0.0.1:8428/api/v1/query --data-urlencode "query=$1" | grep -q '"value"'; }
          for _ in $(seq 70); do
            for status in 200 200 304 404 429 500; do
              echo "{\"time\":$(date +%s.%3N),\"group\":\"api\",\"method\":\"GET\",\"status\":$status,\"request_time\":0.042,\"upstream_time\":\"0.040\",\"bytes\":512,\"limit\":\"\"}" \
                | sudo tee -a /var/log/nginx/findaline.metrics.log > /dev/null
            done
            if query nginx_requests_request_time_count && query findaline_backup_time && query systemd_units_active_code; then
              break
            fi
            sleep 5
          done
          for name in cpu_usage_idle docker_container_mem_usage_percent nginx_requests_request_time_count \
                      findaline_facts_time findaline_backup_time systemd_units_active_code; do
            query "$name" || { echo "no samples of $name"; exit 1; }
          done

      # A line of nginx's error log with a client address: in VictoriaLogs (Telegraf flushes every
      # 30 s), masked (its JSON writes < as \u003c); then the same line through Grafana in the live test
      - name: Logs
        run: |
          echo "$(date '+%Y/%m/%d %H:%M:%S') [error] 812#812: *1 ci-log-line upstream timed out, client: 203.0.113.7, server: findaline.example.org" \
            | sudo tee -a /var/log/nginx/findaline.error.log > /dev/null
          for _ in $(seq 24); do
            out=$(curl -sf http://127.0.0.1:9428/select/logsql/query --data-urlencode 'query="ci-log-line"') || true
            [ -n "$out" ] && break
            sleep 5
          done
          echo "$out"
          echo "$out" | grep -qF 'client: \u003caddress>' && ! echo "$out" | grep -q 203.0.113.7

      # Grafana's API with the admin's password: health, the data sources and the plugin, the
      # dashboards, every rule, the contact points, every query of the rules and panels, the line
      - name: Grafana
        env:
          FINDALINE_GRAFANA_URL: http://127.0.0.1:3000
          FINDALINE_LOG_LINE: ci-log-line
        run: |
          export FINDALINE_GRAFANA_PASSWORD="$(cat secrets/grafana_admin_password)"
          uv run --frozen pytest -q tests/test_monitoring.py -k live

      - name: The stack's logs
        if: always()
        run: |
          $COMPOSE logs --no-color
          sudo journalctl --no-pager -u telegraf

      - name: Clean up
        if: always()
        run: $COMPOSE down --volumes
